name: astrbot_plugin_ongeki_gacha
display_name: 音击抽卡模拟器
short_desc: 本地娱乐向的音击抽卡与主角色养成：签到、抽卡、卡册、天井、月卡、好感养成、角色语音与音游随机任务。
desc: |
  音击（ONGEKI）卡牌抽卡与主角色养成模拟器。

  支持每日签到、月卡、连续签到奖励、1/5/11 连抽卡、常驻池、官方卡池轮替、
  UP 权重与天井兑换；抽卡结果使用本地高清卡面与 Pillow 合成图片，卡册可按角色
  分页查看卡ID。17 名主角色默认开放好感养成：伙伴、陪伴、送礼、好感等级、
  基础N卡升星、好感奖励与装扮、角色语音、解花/超解花，好感无封顶（最高 99/99）。
  另有音游随机任务系统，接入音击、舞萌 DX、中二节奏真实曲库，支持普通 / 挑战 / 高级挑战 /
  终极任务、成绩照片提交与管理审核发点。

  使用 `/帮助` 查看全部命令，`/签到` 开始赚点数，`/好感 列表` 查看养成进度。
  支持 OneBot（aiocqhttp）与 QQ 官方机器人（qq_official）；QQ 官方适配器只提供
  openid，需先 `/绑定QQ <QQ号>` 绑定数字 QQ，再使用依赖身份绑定的功能；该平台也
  收不到 @ 普通成员的 openid，`/奖励`、`/终极完成` 请改用数字 QQ 指定目标。
  素材默认读取插件目录 `assets/card_data`，可在 WebUI 配置面板改为外部绝对路径。
